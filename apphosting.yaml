# Firebase App Hosting — runtime and build configuration.
#
# App Hosting builds this repository and runs it on Cloud Run. Every route in
# this app is server-rendered on demand and the write paths are Server Actions,
# so a static export is not an option and plain Firebase Hosting cannot serve
# it. App Hosting is the product that can, and it requires a billing account:
# there is no version of this application that runs on the no-cost Spark plan.
#
# Being on Blaze is not the same as paying, though. Everything this app uses —
# App Hosting bandwidth, Cloud Run compute, Firestore reads and writes,
# Authentication — has a no-cost allowance that Blaze includes, and the
# settings below are chosen to stay inside them. What Blaze changes is what
# happens at the ceiling: usage past the allowance is billed at a few cents
# rather than refused, so an unusually busy day costs pocket change instead of
# stopping inspectors from recording work.
#
# Nothing secret belongs in this file. It is committed. There is no database
# password to hold: Firestore is reached with the runtime service account.

runConfig:
  # Scale to zero. Cloud Run's no-cost allowance covers a single plant
  # comfortably at this setting, and would not if an instance were held warm
  # around the clock.
  #
  # The cost is a cold start on the first request after an idle spell — a few
  # seconds while the container boots. If inspectors find that irritating
  # enough to matter, raising this to 1 is the fix, and it is the one setting
  # here that turns a near-zero bill into a small monthly one.
  minInstances: 0

  # Firestore has no connection pool to exhaust, so this ceiling is only about
  # how much traffic to absorb before queueing rather than about protecting the
  # database — which is the main practical difference from running on SQL.
  maxInstances: 10

  concurrency: 80

  cpu: 1
  # Next.js does not sit comfortably in 512 MiB.
  memoryMiB: 1024

env:
  # ── Firebase Authentication, browser side ──────────────────────────────────
  # These are not secrets. They name the project; they grant nothing. Every
  # authorisation decision is made on the server against the user document, and
  # `firestore.rules` denies all client access to the database.
  #
  # They are read by `next build` and inlined into the browser bundle, so they
  # need BUILD availability — a RUNTIME-only value would reach the container
  # and still leave the bundle holding `undefined`.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_WEB_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_PROJECT_ID.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  # ── Firebase Admin, server side ────────────────────────────────────────────
  # The Admin SDK takes its credentials from the Cloud Run runtime service
  # account, so there is no key file and no secret to rotate. That service
  # account needs two things, and the README has the commands:
  #
  #   - the Service Account Token Creator role on itself, because minting a
  #     session cookie is a signing operation. Without it, sign-in fails at the
  #     last step with a permission error.
  #   - Cloud Datastore User, to read and write Firestore.
  - variable: FIREBASE_PROJECT_ID
    value: REPLACE_WITH_PROJECT_ID
    availability:
      - RUNTIME

  # ── Display ────────────────────────────────────────────────────────────────
  # Read at build time and inlined, so changing it needs a rebuild, not a
  # restart. The container's own clock is UTC; this is what dates are rendered
  # in.
  - variable: NEXT_PUBLIC_QC_TIME_ZONE
    value: Africa/Cairo
    availability:
      - BUILD
      - RUNTIME
