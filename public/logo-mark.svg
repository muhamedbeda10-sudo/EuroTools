<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 92" role="img" aria-label="EURO">
  <defs>
    <linearGradient id="euroBlue" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#8ED8F8"/>
      <stop offset="0.45" stop-color="#4FB3E8"/>
      <stop offset="1" stop-color="#1478C0"/>
    </linearGradient>
    <linearGradient id="euroRed" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F0463A"/>
      <stop offset="1" stop-color="#C81E14"/>
    </linearGradient>
  </defs>

  <!-- The roof: a chevron of even thickness, apex slightly left of centre. -->
  <path fill="url(#euroBlue)"
        d="M50 2 L102 42 L102 70 L50 30 L50 2 Z"/>
  <path fill="url(#euroBlue)" opacity="0.85"
        d="M50 2 L50 30 L14 58 L14 30 L50 2 Z"/>

  <!-- The red mark beneath the left arm. It leans the same way the right arm
       of the roof does, not the left: mirrored, it read as a second left arm
       and the mark lost the turn the company's own artwork has in it. -->
  <path fill="url(#euroRed)"
        d="M16 44 L16 74 L46 92 L46 62 L16 44 Z"/>
</svg>
